apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-backend
  labels: {app: hello-backend}
spec:
  replicas: 1
  selector:
    matchLabels: {app: hello-backend}
  template:
    metadata:
      labels: {app: hello-backend, version: v1}
    spec:
      containers:
        - name: backend
          image: collapser-backend:latest
          imagePullPolicy: Never   # image is side-loaded into kind, never pulled
          ports:
            - {name: grpc, containerPort: 50051}
            - {name: stats, containerPort: 8080}
          env:
            - {name: BACKEND_LATENCY, value: "50ms"}
          readinessProbe:
            httpGet: {path: /health, port: stats}
            initialDelaySeconds: 1
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
        # Collapser is the application sidecar. It receives traffic through the
        # collapser-proxy Service and calls this backend over the pod's loopback
        # interface, so duplicate requests are absorbed before leaving the pod.
        - name: collapser
          image: collapser-proxy:latest
          imagePullPolicy: Never
          ports:
            - {name: grpc-collapser, containerPort: 50052}
            - {name: metrics, containerPort: 2112}
          env:
            - {name: BACKEND_ADDRESS, value: "localhost:50051"}
            - {name: COLLAPSER_CACHE_DURATION, value: "100ms"}
            - {name: COLLAPSER_MAX_CACHE_ENTRIES, value: "10000"}
            - {name: LOG_FORMAT, value: "json"}
          livenessProbe:
            httpGet: {path: /health, port: metrics}
            initialDelaySeconds: 2
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /ready, port: metrics}
            initialDelaySeconds: 1
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 1000m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: hello-backend
  labels: {app: hello-backend}
spec:
  selector: {app: hello-backend}
  ports:
    - {name: http-stats, port: 8080, targetPort: stats}
