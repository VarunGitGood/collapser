# Grafana is intentionally anonymous-viewer only for this disposable local lab.
# Do not copy that setting into a shared or internet-facing cluster.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: observability
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.observability.svc.cluster.local:9090
        isDefault: true
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: observability
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: Collapser
        orgId: 1
        folder: Collapser
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-collapser
  namespace: observability
data:
  collapser.json: |
    {
      "annotations": {"list": [{"builtIn": 1, "datasource": {"type": "grafana", "uid": "-- Grafana --"}, "enable": true, "hide": true, "iconColor": "rgba(0, 211, 255, 1)", "name": "Annotations & Alerts", "type": "dashboard"}]},
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "panels": [
        {"datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "decimals": 0, "unit": "short"}, "overrides": []}, "gridPos": {"h": 7, "w": 4, "x": 0, "y": 0}, "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"}, "targets": [{"expr": "sum(increase(collapser_requests_total[$__range]))", "refId": "A"}], "title": "Requests", "type": "stat"},
        {"datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "decimals": 0, "unit": "short"}, "overrides": []}, "gridPos": {"h": 7, "w": 4, "x": 4, "y": 0}, "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"}, "targets": [{"expr": "sum(increase(collapser_backend_calls_total[$__range]))", "refId": "A"}], "title": "Backend calls", "type": "stat"},
        {"datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"color": {"mode": "green-yellow-red", "mode": "thresholds"}, "decimals": 1, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 90}]}, "unit": "percent"}, "overrides": []}, "gridPos": {"h": 7, "w": 4, "x": 8, "y": 0}, "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"}, "targets": [{"expr": "100 * (1 - (sum(increase(collapser_backend_calls_total[$__range])) / clamp_min(sum(increase(collapser_requests_total[$__range])), 1)))", "refId": "A"}], "title": "Backend load removed", "type": "stat"},
        {"datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "decimals": 0, "unit": "short"}, "overrides": []}, "gridPos": {"h": 7, "w": 4, "x": 12, "y": 0}, "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"}, "targets": [{"expr": "sum(increase(collapser_collapsed_requests_total[$__range]))", "refId": "A"}], "title": "Collapsed requests", "type": "stat"},
        {"datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "decimals": 0, "unit": "short"}, "overrides": []}, "gridPos": {"h": 7, "w": 4, "x": 16, "y": 0}, "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"}, "targets": [{"expr": "sum(increase(collapser_cache_hits_total[$__range]))", "refId": "A"}], "title": "Cache hits", "type": "stat"},
        {"datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "decimals": 2, "unit": "s"}, "overrides": []}, "gridPos": {"h": 7, "w": 4, "x": 20, "y": 0}, "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"}, "targets": [{"expr": "histogram_quantile(0.95, sum(rate(collapser_backend_latency_seconds_bucket[$__rate_interval])) by (le))", "refId": "A"}], "title": "Backend latency p95", "type": "stat"},
        {"datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "custom": {"axisCenteredZero": false, "drawStyle": "line", "fillOpacity": 12, "lineInterpolation": "linear", "lineWidth": 1, "showPoints": "auto", "spanNulls": false}, "unit": "reqps"}, "overrides": []}, "gridPos": {"h": 9, "w": 12, "x": 0, "y": 7}, "options": {"legend": {"calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "none"}}, "targets": [{"expr": "sum(rate(collapser_requests_total[$__rate_interval]))", "legendFormat": "requests", "refId": "A"}, {"expr": "sum(rate(collapser_backend_calls_total[$__rate_interval]))", "legendFormat": "backend calls", "refId": "B"}, {"expr": "sum(rate(collapser_collapsed_requests_total[$__rate_interval]))", "legendFormat": "collapsed", "refId": "C"}, {"expr": "sum(rate(collapser_cache_hits_total[$__rate_interval]))", "legendFormat": "cache hits", "refId": "D"}], "title": "Request handling rate", "type": "timeseries"},
        {"datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "custom": {"axisCenteredZero": false, "drawStyle": "line", "fillOpacity": 12, "lineInterpolation": "linear", "lineWidth": 1, "showPoints": "auto", "spanNulls": false}, "unit": "short"}, "overrides": []}, "gridPos": {"h": 9, "w": 12, "x": 12, "y": 7}, "options": {"legend": {"calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "none"}}, "targets": [{"expr": "sum(collapser_inflight_requests)", "legendFormat": "in-flight leaders", "refId": "A"}, {"expr": "sum(collapser_cached_results)", "legendFormat": "cached results", "refId": "B"}], "title": "Collapser state", "type": "timeseries"}
      ],
      "refresh": "5s",
      "schemaVersion": 41,
      "tags": ["collapser", "prometheus", "kind"],
      "time": {"from": "now-15m", "to": "now"},
      "timezone": "browser",
      "title": "Collapser / Request collapsing",
      "uid": "collapser",
      "version": 1
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability
  labels: {app: grafana}
spec:
  replicas: 1
  selector:
    matchLabels: {app: grafana}
  template:
    metadata:
      labels: {app: grafana}
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.0.0
          env:
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
          ports:
            - {name: http, containerPort: 3000}
          volumeMounts:
            - {name: datasource, mountPath: /etc/grafana/provisioning/datasources, readOnly: true}
            - {name: dashboard-provider, mountPath: /etc/grafana/provisioning/dashboards, readOnly: true}
            - {name: dashboard, mountPath: /var/lib/grafana/dashboards, readOnly: true}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
      volumes:
        - name: datasource
          configMap: {name: grafana-datasource}
        - name: dashboard-provider
          configMap: {name: grafana-dashboard-provider}
        - name: dashboard
          configMap: {name: grafana-dashboard-collapser}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: observability
  labels: {app: grafana}
spec:
  selector: {app: grafana}
  ports:
    - {name: http, port: 3000, targetPort: http}
